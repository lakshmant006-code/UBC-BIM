<!-- @dsCard group="Colors" viewport="700x150" name="Accent — safety orange" subtitle="One accent moment per viewport. Never a background, never a gradient." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--paper)}.c{padding:20px 24px;font-family:var(--font-body)}</style><style></style></head><body><div class="c"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:60px;background:var(--orange);border:1px solid var(--line);border-radius:var(--r-1)"></div><div style="font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)">Accent</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">--orange #FF4D14</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:60px;background:var(--orange-press);border:1px solid var(--line);border-radius:var(--r-1)"></div><div style="font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)">Press</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">--orange-press #D93C08</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:60px;background:var(--orange-tint);border:1px solid var(--line);border-radius:var(--r-1)"></div><div style="font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)">Tint</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">--orange-tint #FFE9E1</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:60px;background:var(--focus-ring);border:1px solid var(--line);border-radius:var(--r-1)"></div><div style="font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)">Focus ring</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">--focus-ring 45%</div></div></div></div></body></html>
