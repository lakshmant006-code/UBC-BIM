<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--paper)}.c{padding:20px 24px;font-family:var(--font-body)}</style><style></style></head><body><div class="c"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:60px;background:var(--ink);border:1px solid var(--line);border-radius:var(--r-1)"></div><div style="font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)">Ink</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">--ink #101215 · headings</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:60px;background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r-1)"></div><div style="font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)">Ink 2</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">--ink-2 #2C3037 · body</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:60px;background:var(--ink-3);border:1px solid var(--line);border-radius:var(--r-1)"></div><div style="font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)">Ink 3</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">--ink-3 #5A6069 · muted</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:60px;background:var(--ink-4);border:1px solid var(--line);border-radius:var(--r-1)"></div><div style="font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)">Ink 4</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">--ink-4 #8B9199 · faint</div></div></div></div></body></html>
