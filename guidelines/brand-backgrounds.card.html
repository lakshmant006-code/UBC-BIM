<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--paper)}.c{padding:20px 24px;font-family:var(--font-body)}</style><style>.m{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);margin-top:8px}</style></head><body><div class="c"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
<div><div style="height:76px;background:var(--paper);border:1px solid var(--line)"></div><div class="m">paper flat</div></div>
<div><div class="ubc-grid" style="height:76px;border:1px solid var(--line);background-color:var(--paper)"></div><div class="m">drafting grid</div></div>
<div><div style="height:76px;background:var(--surface-sunken);border-top:1px solid var(--line);border-bottom:1px solid var(--line)"></div><div class="m">sunken band</div></div>
<div><div style="height:76px;background:var(--surface-inverse)"></div><div class="m">inverse stage · 1×/page</div></div></div></div></body></html>
