<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--paper)}.c{padding:20px 24px;font-family:var(--font-body)}</style><style>.r{opacity:0;transform:translateY(20px);animation:rv var(--dur-4) var(--ease-out) forwards}@keyframes rv{to{opacity:1;transform:none}}</style></head><body><div class="c"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px"><div class="r" style="animation-delay:0ms"><div class="ubc-label">LAYER 01</div><div style="height:52px;background:var(--white);border:1px solid var(--line);border-top:2px solid var(--accent);margin-top:8px"></div></div><div class="r" style="animation-delay:80ms"><div class="ubc-label">LAYER 02</div><div style="height:52px;background:var(--white);border:1px solid var(--line);border-top:2px solid var(--accent);margin-top:8px"></div></div><div class="r" style="animation-delay:160ms"><div class="ubc-label">LAYER 03</div><div style="height:52px;background:var(--white);border:1px solid var(--line);border-top:2px solid var(--accent);margin-top:8px"></div></div><div class="r" style="animation-delay:240ms"><div class="ubc-label">LAYER 04</div><div style="height:52px;background:var(--white);border:1px solid var(--line);border-top:2px solid var(--accent);margin-top:8px"></div></div></div></div></body></html>
