<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--paper)}.c{padding:20px 24px;font-family:var(--font-body)}</style><style></style></head><body><div class="c"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:60px;background:var(--steel);border:1px solid var(--line);border-radius:var(--r-1)"></div><div style="font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)">Steel</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">--steel #3C4A5A</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:60px;background:var(--steel-tint);border:1px solid var(--line);border-radius:var(--r-1)"></div><div style="font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)">Steel tint</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">--steel-tint #E3E7EC</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:60px;background:var(--blueprint);border:1px solid var(--line);border-radius:var(--r-1)"></div><div style="font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)">Blueprint</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">--blueprint #1B4DFF</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:60px;background:var(--surface-inverse);border:1px solid var(--line);border-radius:var(--r-1)"></div><div style="font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)">Inverse</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">--surface-inverse · stage</div></div></div></div></body></html>
