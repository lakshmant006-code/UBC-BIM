<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--paper)}.c{padding:20px 24px;font-family:var(--font-body)}</style><style></style></head><body><div class="c"><div style="display:flex;flex-direction:column;gap:9px"><div style="display:grid;grid-template-columns:96px 1fr 130px;align-items:center;gap:12px"><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-body)">120ms</span><div style="height:3px;background:var(--paper-3)"><div style="height:3px;width:10%;background:var(--accent)"></div></div><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-faint)">hover</span></div><div style="display:grid;grid-template-columns:96px 1fr 130px;align-items:center;gap:12px"><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-body)">200ms</span><div style="height:3px;background:var(--paper-3)"><div style="height:3px;width:17%;background:var(--accent)"></div></div><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-faint)">state change</span></div><div style="display:grid;grid-template-columns:96px 1fr 130px;align-items:center;gap:12px"><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-body)">340ms</span><div style="height:3px;background:var(--paper-3)"><div style="height:3px;width:29%;background:var(--accent)"></div></div><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-faint)">panel slide</span></div><div style="display:grid;grid-template-columns:96px 1fr 130px;align-items:center;gap:12px"><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-body)">620ms</span><div style="height:3px;background:var(--paper-3)"><div style="height:3px;width:52%;background:var(--accent)"></div></div><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-faint)">section reveal</span></div><div style="display:grid;grid-template-columns:96px 1fr 13
