<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--paper)}.c{padding:20px 24px;font-family:var(--font-body)}</style><style></style></head><body><div class="c"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:60px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-1)"></div><div style="font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)">Paper</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">--paper #F5F4F1 · page</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:60px;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r-1)"></div><div style="font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)">Paper 2</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">--paper-2 #EFEDE8 · sunken</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:60px;background:var(--paper-3);border:1px solid var(--line);border-radius:var(--r-1)"></div><div style="font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)">Paper 3</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">--paper-3 #E6E3DC · band</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:60px;background:var(--white);border:1px solid var(--line);border-radius:var(--r-1)"></div><div style="font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)">White</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">--white · cards only</div></div></div></div></body></html>
