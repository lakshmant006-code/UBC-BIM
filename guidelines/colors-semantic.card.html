<!-- @dsCard group="Colors" viewport="700x150" name="Semantic — status" subtitle="Clash detection reads danger; resolved reads ok." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--paper)}.c{padding:20px 24px;font-family:var(--font-body)}</style><style></style></head><body><div class="c"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:60px;background:var(--ok);border:1px solid var(--line);border-radius:var(--r-1)"></div><div style="font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)">OK / resolved</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">--ok #0F8F6B</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:60px;background:var(--warn);border:1px solid var(--line);border-radius:var(--r-1)"></div><div style="font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)">Warn</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">--warn #C98A00</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:60px;background:var(--danger);border:1px solid var(--line);border-radius:var(--r-1)"></div><div style="font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)">Danger / clash</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">--danger #C42B1C</div></div></div></div></body></html>
